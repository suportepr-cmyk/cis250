<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Febracis Curitiba – Grupos CIS 250</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: url('Arte_cis_feed_02.jpg') center center / cover no-repeat fixed;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 2rem;
  }
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 420px;
    width: 100%;
    padding-bottom: 2.5rem;
  }
  .logo {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.6);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.3rem;
  }
  .subtitle {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    margin-bottom: 2rem;
  }
  .card {
    background: rgba(10,10,10,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1rem;
    text-decoration: none;
    display: block;
    transition: background 0.2s;
  }
  .card:hover { background: rgba(20,20,20,0.85); }
  .card.bronze { border-top: 3px solid #cd7f32; }
  .card.black  { border-top: 3px solid #a0a0a0; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 0.6rem;
  }
  .badge.bronze { background: rgba(205,127,50,0.2); color: #cd7f32; }
  .badge.black  { background: rgba(160,160,160,0.15); color: #c0c0c0; border: 1px solid rgba(255,255,255,0.15); }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 0.2rem;
  }
  .card-desc { font-size: 13px; color: rgba(255,255,255,0.5); }
  .arrow { font-size: 16px; color: rgba(255,255,255,0.3); margin-top: 0.6rem; }
  .footer { margin-top: 1.5rem; font-size: 11px; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
  <p class="logo">Febracis Curitiba</p>
  <h1>Método CIS 250</h1>
  <p class="subtitle">Selecione o grupo correspondente ao seu ingresso</p>

  <a class="card bronze" href="https://chat.whatsapp.com/DQVHuUbDUkODtIhLBtQRxc?mode=gi_t" target="_blank">
    <span class="badge bronze">Bronze</span>
    <div class="card-title">Grupo Bronze</div>
    <div class="card-desc">Entrar no grupo de WhatsApp</div>
    <div class="arrow">→</div>
  </a>

  <a class="card black" href="https://chat.whatsapp.com/LeJ0HHZpHla6bN9BarBIHL?mode=gi_t" target="_blank">
    <span class="badge black">Black</span>
    <div class="card-title">Grupo Black</div>
    <div class="card-desc">Entrar no grupo de WhatsApp</div>
    <div class="arrow">→</div>
  </a>

  <p class="footer">Febracis Curitiba · Método CIS 250</p>
</div>
</body>
</html>
