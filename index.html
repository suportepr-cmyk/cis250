<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Febracis Curitiba – Grupos CIS 250</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', sans-serif;
    padding: 2rem;
  }
  .container {
    text-align: center;
    max-width: 420px;
    width: 100%;
  }
  .logo {
    font-size: 13px;
    letter-spacing: 0.2em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }
  h1 {
    font-size: 26px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 0.4rem;
  }
  .subtitle {
    font-size: 14px;
    color: #666;
    margin-bottom: 2.5rem;
  }
  .card {
    background: #141414;
    border: 1px solid #222;
    border-radius: 16px;
    padding: 1.5rem;
    margin-bottom: 1rem;
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: border-color 0.2s, background 0.2s;
  }
  .card:hover { background: #1a1a1a; }
  .card.bronze { border-top: 3px solid #cd7f32; }
  .card.black { border-top: 3px solid #a0a0a0; }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 4px 10px;
    border-radius: 20px;
    margin-bottom: 0.75rem;
  }
  .badge.bronze { background: #2a1a00; color: #cd7f32; }
  .badge.black { background: #1a1a1a; color: #c0c0c0; border: 1px solid #333; }
  .card-title {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 0.3rem;
  }
  .card-desc { font-size: 13px; color: #666; }
  .arrow { font-size: 18px; color: #444; margin-top: 0.75rem; }
  .footer { margin-top: 2rem; font-size: 12px; color: #333; }
</style>
</head>
<body>
<div class="container">
  <p class="logo">Febracis Curitiba</p>
  <h1>Método CIS 250</h1>
  <p class="subtitle">Selecione o grupo correspondente ao seu ingresso</p>

  <a class="card bronze" href="https://chat.whatsapp.com/DQVHuUbDUkODtIhLBtQRxc?mode=gi_t" target="_blank">
    <span class="badge bronze">Bronze</span>
    <div class="card-title">Grupo Bronze</div>
    <div class="card-desc">Entrar no grupo de WhatsApp</div>
    <div class="arrow">→</div>
  </a>

  <a class="card black" href="https://chat.whatsapp.com/LeJ0HHZpHla6bN9BarBIHL?mode=gi_t" target="_blank">
    <span class="badge black">Black</span>
    <div class="card-title">Grupo Black</div>
    <div class="card-desc">Entrar no grupo de WhatsApp</div>
    <div class="arrow">→</div>
  </a>

  <p class="footer">Febracis Curitiba · Método CIS 250</p>
</div>
</body>
</html>
